name: Test
on:
  # **Every push, not only `main`** (DL37). A branch's suite was green by absence:
  # this workflow skipped a feature branch entirely, so a test added on one had
  # never run in CI at all — which is how a compiler test can be "in the suite"
  # and still never execute. `main` is included, unchanged; the filter is gone
  # rather than widened to a list, because the next branch is not knowable here.
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Pinned, not "latest": the compiled fixtures in tests/compiler are exact bytes,
  # and an emscripten upgrade can move them. `scripts/build-binaryen.js` records the
  # version in the artifact's stamp; CI builds with this one.
  EMSDK_VERSION: "7.0.0"

jobs:
  binaryen:
    name: "Binaryen"
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6
      with:
        # `third_party/binaryen` is where the compiler's Binaryen comes from.
        submodules: true
    - name: "Resolve the Binaryen pin"
      id: pin
      run: echo "sha=$(git -C third_party/binaryen rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: "Restore the built artifact"
      id: cache
      uses: actions/cache@v4
      with:
        path: third_party/binaryen-out
        # Keyed on the pin and the emscripten version, so a Binaryen bump or a
        # toolchain bump invalidates it and a compiler change does not. The
        # artifact is a build product of a gitlink, exactly like `.packs/` in
        # Tension, so nothing about it is committed.
        key: binaryen-${{ runner.os }}-${{ steps.pin.outputs.sha }}-${{ env.EMSDK_VERSION }}
    - uses: actions/setup-node@v6
      with:
        node-version: current
    - name: "Install dependencies"
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci --no-audit
    - uses: mymindstorm/setup-emsdk@v14
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        version: ${{ env.EMSDK_VERSION }}
    - name: "Build Binaryen"
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm run binaryen:build
    - name: "Publish the artifact for the other jobs"
      uses: actions/upload-artifact@v4
      with:
        name: binaryen-out
        # Only the three files `scripts/build-binaryen.js` produces and its stamp
        # checks; the build tree next to them is 169 MB that no other job reads.
        path: |
          third_party/binaryen-out/binaryen.js
          third_party/binaryen-out/binaryen.d.ts
          third_party/binaryen-out/stamp.json
        retention-days: 1

  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: "Check that distribution files are unmodified"
      if: github.event_name == 'pull_request'
      run: |
        if git --no-pager diff --name-only $(git rev-parse origin/${{ github.base_ref }})...${{ github.sha }} | grep -q "^dist/"; then
          printf "\nThe pull request modifies distribution files, but it shouldn't.\n" &&
          printf "Please see https://github.com/Yabgu/TensionScript/blob/main/CONTRIBUTING.md\n" &&
          exit 1;
        else
          printf "\nOK: Distributions files have not been modified.\n";
        fi
  compiler:
    name: "Compiler (${{ matrix.os }}, node ${{ matrix.node_version }})"
    runs-on: ${{ matrix.os }}-latest
    needs: [check, binaryen]
    strategy:
      matrix:
        os: ["ubuntu", "macos", "windows"]
        node_version: ["current", "lts/*"]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node_version }}
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: Check
      run: npm run check
    - name: Test
      run: npm test
  bootstrap:
    name: "Bootstrap (${{ matrix.target }})"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    strategy:
      matrix:
        target: ["debug", "release"]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        node-version: current
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: "Bootstrap ${{ matrix.target }}"
      run: npm run bootstrap:${{ matrix.target }}
    - name: "Test ${{ matrix.target }}"
      run: npm run test:compiler -- --wasm build/assemblyscript.${{ matrix.target }}-bootstrap.js
    - name: "Compile ${{ matrix.target }} -> ${{ matrix.target == 'debug' && 'release' || 'debug' }}"
      run: node bin/tensionscript.js --config src/asconfig.json --target ${{ matrix.target == 'debug' && 'release' || 'debug' }}-bootstrap --wasm ./build/assemblyscript.${{ matrix.target }}-bootstrap.js
    - name: "Test ${{ matrix.target == 'debug' && 'release' || 'debug' }}"
      run: npm run test:compiler -- --wasm build/assemblyscript.${{ matrix.target == 'debug' && 'release' || 'debug' }}-bootstrap.js
  features:
    name: "Features"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: Test experimental features
      env:
        ASC_FEATURES: threads,reference-types,gc,exception-handling
      run: |
        npm run test:compiler features/threads features/reference-types features/gc features/exception-handling bindings/esm bindings/raw
  coreloop:
    name: "Async core loop"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    env:
      # Pinned, not `latest`: the whole point is a module that one engine version
      # compiles and runs, and the text/validation surface of stack switching is
      # still moving. `package.json`'s `config.wasmtime` records the same version
      # for local runs.
      WASMTIME_VERSION: "v50.0.2"
      # Make the test fail, not skip, if the binary is missing: this is the job
      # that exists to execute the shell.
      REQUIRE_WASMTIME: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        node-version: current
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: "Install wasmtime (pinned)"
      run: |
        curl -fsSL https://wasmtime.dev/install.sh | bash -s -- --version "$WASMTIME_VERSION"
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
    - name: "Run the async core loop test"
      run: |
        wasmtime --version
        npm run test:coreloop
        npm run test:await
  gate4:
    name: "Gate 4 (threads)"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        # `current` only, deliberately not the lts/* matrix: wasmfx is what the
        # suite executes, and an LTS without it would turn this job red for a
        # reason that has nothing to do with the code.
        node-version: current
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: "Run Gate 4 (110 checks)"
      run: npm run test:gate4
    - name: "Run the four showcase programs"
      run: npm run test:examples

  runtimes:
    name: "Runtimes"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        node-version: current
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: Test default allocator
      run: |
        cd tests/allocators/default
        npm run build
        cd ..
        npm test default
    - name: Test stub allocator
      run: |
        cd tests/allocators/stub
        npm run build
        cd ..
        npm test stub
  loader:
    name: "Loader"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        node-version: current
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    - name: Test the loader
      run: |
        cd lib/loader
        npm run asbuild
        npm run test
  coverage:
    name: "Coverage"
    runs-on: ubuntu-latest
    needs: [check, binaryen]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: "Download the vendored Binaryen"
      uses: actions/download-artifact@v4
      with:
        name: binaryen-out
        path: third_party/binaryen-out
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci --no-audit
    - name: Build
      run: npm run build
    # **A named waiver, with its numbers** (DL50). `npm test` under c8 accumulates one
    # coverage JSON per process that loads the compiler bundle, and **that corpus is the
    # coverage**: measured over a full local run (820 files, 3.09 GB), compile children are
    # 382 files and 3.02 GB — **97.7% of it** — and dropping them leaves the reporter with
    # **307 statements out of 93,173** (0.3%), i.e. the test runners themselves. The
    # compiler's coverage *is* what those compiles record, so the corpus cannot be shrunk
    # without gutting the job, and the reporter's memory scales with it.
    #
    # The same corpus, same machine (Node 26), reporter only:
    #   npx c8 report --temp-directory ./.coverage            -> exit 134, GC abort
    #   NODE_OPTIONS=--max-old-space-size=8192 …              -> exit 0, summary printed
    # CI died exactly that way at `184b5d6f` on Node 24: exit 134 *after* the last suite
    # had passed. Nothing was failing; the reporter ran out of memory.
    #
    # **This is a knife-edge, not a regression.** Between the last green tip (`113fdd24`)
    # and the red one (`184b5d6f`) **no test file changed** — the diff is `cli/index.js`
    # and `src/ast.ts` — so the compile count and the corpus size are unchanged. DL45
    # already measured this reporter needing 8 GB and made CI fit by shaving one test's
    # contribution from 46 MB to 264 KB (still true: that test now adds 180 KB), i.e. by
    # ~0.0016% of the corpus. A gate whose margin is that thin was never a property.
    #
    # What is waived: the reporter gets 8 GB instead of the default. **Nothing is
    # bypassed** — every suite still runs and the summary is unchanged at any heap size.
    # The corpus size is printed every run so the trend is visible rather than discovered
    # as a red job. When 8 GB is no longer enough, the fix is per-suite reporting, not a
    # larger number.
    - name: Collect coverage
      env:
        NODE_OPTIONS: --max-old-space-size=8192
      run: |
        npx c8 --temp-directory ./.coverage -r none -- npm test
        echo "coverage corpus: $(du -sh ./.coverage | cut -f1) in $(ls ./.coverage | wc -l) files"
    - name: Output coverage summary
      env:
        NODE_OPTIONS: --max-old-space-size=8192
      run: npx c8 report --temp-directory ./.coverage -r text-summary
